version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - depguard
    - revive
    - whitespace
    - errcheck
  settings:
    depguard:
      rules:
        handler-runtime:
          files:
            - '**/pkg/handler/runtime/*.go'
          deny:
            - pkg: github.com/flatcar/nebraska/backend/pkg/api/admin
              desc: endpoints served on every node must not reach the admin write surface
            - pkg: github.com/flatcar/nebraska/backend/pkg/api$
              desc: handlers reach the database through a role-scoped service, not the root package
        handler-admin:
          files:
            - '**/pkg/handler/admin/*.go'
          deny:
            - pkg: github.com/flatcar/nebraska/backend/pkg/api/runtime
              desc: admin endpoints write runtime state only through LocalUpdatesBrake
            - pkg: github.com/flatcar/nebraska/backend/pkg/api$
              desc: handlers reach the database through a role-scoped service, not the root package
        handler-base:
          files:
            - '**/pkg/handler/base/*.go'
          deny:
            - pkg: github.com/flatcar/nebraska/backend/pkg/api
              desc: these endpoints touch no database
        handler-no-service:
          files:
            - '**/pkg/handler/*.go'
            - '**/pkg/handler/internal/shared/*.go'
          deny:
            - pkg: github.com/flatcar/nebraska/backend/pkg/api
              desc: the composite and the shared helpers hold no service, so neither can bridge one role to the other
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: "var-naming: avoid"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/flatcar/nebraska
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
