## Reference: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # These majors require dedicated migration PRs, so hold them out of the
    # grouped updates to keep the group green and mergeable:
    # - typescript 7 breaks the @typescript-eslint peer range (>=4.8.4 <6.1.0)
    # - MUI 8/9 need the Grid v2 / sx migration
    # - eslint-plugin-react-hooks 7.1+ enables new rules that flag existing code
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "@mui/material"
        versions: [">=8.0.0"]
      - dependency-name: "@mui/icons-material"
        versions: [">=8.0.0"]
      - dependency-name: "@mui/system"
        versions: [">=8.0.0"]
      - dependency-name: "@mui/utils"
        versions: [">=8.0.0"]
      - dependency-name: "@mui/styled-engine-sc"
        versions: [">=8.0.0"]
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=7.1.0"]

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "gomod"
    directory: "/updater"
    schedule:
      interval: "weekly"
      day: "monday"
