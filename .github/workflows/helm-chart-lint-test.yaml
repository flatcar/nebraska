name: Lint and Test Charts

on:
  pull_request:
    paths:
      - charts/**
      - '!charts/**/README.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.12.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct.yaml

      # The chart rejects some values on purpose: old Bitnami values, a Bitnami
      # image, and a persistent upgrade without acknowledgeDataDirMigration.
      # `ct` renders only the default values, so it never tests these cases.
      - name: Check that the chart rejects unsafe values
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          renders()  { helm template ci charts/nebraska "$@" > /dev/null; }
          rejected() {
            if helm template ci charts/nebraska "$@" > /dev/null 2>&1; then
              echo "::error::the chart should reject: $*"
              exit 1
            fi
          }

          # The renders checks come first: if the chart does not render at all,
          # every rejected check below would pass.
          renders
          renders --set postgresql.primary.persistence.enabled=true            # new install with a PVC
          renders --set postgresql.metrics.enabled=false \
                  --set postgresql.tls.enabled=false \
                  --set postgresql.architecture=standalone                     # Bitnami values that change nothing
          renders --is-upgrade \
                  --set postgresql.primary.persistence.enabled=true \
                  --set postgresql.acknowledgeDataDirMigration=true            # the flag lets the upgrade through

          rejected --set postgresql.metrics.enabled=true                      # Bitnami feature that is gone
          rejected --set postgresql.image.repository=bitnamilegacy/postgresql # Bitnami image
          rejected --set postgresql.primary.resources.limits.memory=4Gi       # moved to postgresql.resources
          rejected --is-upgrade \
                   --set postgresql.primary.persistence.enabled=true          # would start an empty database
          rejected --set config.database.passwordExistingSecret.key=password  # key the chart's Secret does not have
          rejected --set postgresql.dataMountPath=/var/lib//postgresql        # above the image VOLUME

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config .github/ct.yaml
