name: E2E

on:
  pull_request:
    paths:
    - 'frontend/**'
    - 'backend/**'
    - 'Makefile'
    - '.github/**'
    - Dockerfile
    - .dockerignore

permissions:
  contents: read

# A force-push should not leave the previous run burning a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Steps
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        node-version: [24]
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
    - name: run e2e
      run: |
        make install-ci
        make install-playwright
        make test-playwright-ci
      working-directory: frontend
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 3
    # Upload first because OIDC overwrites the report directory.
    - name: run oidc e2e
      # Run independently from the regular E2E result.
      if: ${{ !cancelled() }}
      run: make test-oidc-ci
      working-directory: frontend
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-oidc
        path: frontend/playwright-report/
        retention-days: 3
