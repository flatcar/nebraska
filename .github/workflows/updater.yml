name: updater
on:
  pull_request:
    paths:
    - 'updater/**'
    - 'backend/**'
    - '.github/workflows/updater.yml'

permissions:
  contents: read

jobs:
  build:
    name: Test updater library
    runs-on: ubuntu-24.04
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # Workspace builds both modules, so use the higher `go` directive.
        go-version-file: ./backend/go.mod
      id: go

    # Resolve the backend from this checkout rather than the pin in
    # updater/go.mod, so backend changes that break these tests fail here.
    - name: Link updater to the in-tree backend
      run: go work init ./backend ./updater

    - name: Start postgres dependency
      run: |
        docker compose -f backend/docker-compose.test.yaml up -d postgres

    - name: Test library
      env:
        NEBRASKA_DB_URL: "postgres://postgres:nebraska@127.0.0.1:8001/nebraska_tests?sslmode=disable&connect_timeout=10"
      run: |
        cd updater
        go test -v ./...
